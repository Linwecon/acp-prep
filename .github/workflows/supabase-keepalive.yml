name: Supabase Keep-Alive

# 每 6 小时检查 Auth 并执行数据库查询，降低低活跃暂停风险。
# 前置条件：在 SQL Editor 执行 supabase/keepalive_ping.sql。
# 定时请求不能保证平台不暂停项目，也无法恢复已暂停项目。
#
# ⚠️ 两点注意：
#   1. 定时任务只在仓库默认分支（main）上生效；
#   2. 仓库连续 60 天没有任何提交时，GitHub 会自动停用定时任务，
#      届时到 Actions 页面点一次「Enable workflow」即可恢复。

on:
  schedule:
    # 北京时间 05:17、11:17、17:17、23:17（实际运行可能延迟）
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch: # 支持手动触发，便于随时验证

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ping Supabase
        run: node .github/scripts/supabase-keepalive.mjs
